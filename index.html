<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend System Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── CSS Custom Properties (Light Theme) ──────────── */
    :root {
      --bg-body: #f8f9fb;
      --bg-surface: #ffffff;
      --bg-surface-hover: #f9fafb;
      --bg-input: #f9fafb;
      --bg-code-inline: #f1f5f9;
      --bg-code-block: #1e293b;
      --bg-blockquote: #eef2ff;
      --bg-table-head: #f8fafc;
      --bg-nav-hover: #f3f4f6;
      --bg-nav-active: #eef2ff;
      --bg-topbar: rgba(248, 249, 251, 0.85);
      --bg-welcome-card: #ffffff;

      --text-primary: #1a1a2e;
      --text-secondary: #374151;
      --text-tertiary: #4b5563;
      --text-muted: #6b7280;
      --text-faint: #9ca3af;
      --text-code-inline: #e11d48;
      --text-code-block: #e2e8f0;
      --text-link: #6366f1;
      --text-nav-active: #4338ca;

      --border-primary: #e5e7eb;
      --border-code-block: #334155;
      --border-scrollbar: #d1d5db;

      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-shadow: rgba(99, 102, 241, 0.3);
      --accent-glow: rgba(99, 102, 241, 0.1);
      --accent-card-shadow: rgba(99, 102, 241, 0.08);

      --overlay-bg: rgba(0, 0, 0, 0.3);

      --code-scrollbar-track: #1e293b;
      --code-scrollbar-thumb: #475569;
      --bg-code-header: #162032;
      --text-code-lang: #8899b0;
      --text-line-number: #475569;

      color-scheme: light;
    }

    /* ── Dark Theme ───────────────────────────────────── */
    [data-theme="dark"] {
      --bg-body: #0f1117;
      --bg-surface: #181a20;
      --bg-surface-hover: #1e2028;
      --bg-input: #1e2028;
      --bg-code-inline: #1e2028;
      --bg-code-block: #12141a;
      --bg-blockquote: rgba(99, 102, 241, 0.08);
      --bg-table-head: #1a1c24;
      --bg-nav-hover: #1e2028;
      --bg-nav-active: rgba(99, 102, 241, 0.12);
      --bg-topbar: rgba(15, 17, 23, 0.85);
      --bg-welcome-card: #181a20;

      --text-primary: #e2e4e9;
      --text-secondary: #c0c4cc;
      --text-tertiary: #a0a4ae;
      --text-muted: #7a7f8a;
      --text-faint: #5a5f6a;
      --text-code-inline: #f472b6;
      --text-code-block: #d1d5db;
      --text-link: #818cf8;
      --text-nav-active: #a5b4fc;

      --border-primary: #2a2d36;
      --border-code-block: #2a2d36;
      --border-scrollbar: #3a3d46;

      --accent: #818cf8;
      --accent-hover: #6366f1;
      --accent-shadow: rgba(129, 140, 248, 0.25);
      --accent-glow: rgba(129, 140, 248, 0.15);
      --accent-card-shadow: rgba(129, 140, 248, 0.06);

      --overlay-bg: rgba(0, 0, 0, 0.55);

      --code-scrollbar-track: #12141a;
      --code-scrollbar-thumb: #3a3d46;
      --bg-code-header: #0d0f14;
      --text-code-lang: #6b7280;
      --text-line-number: #3a3d46;

      color-scheme: dark;
    }

    /* ── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Layout ───────────────────────────────────────── */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ──────────────────────────────────────── */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-primary);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      transition: transform 0.3s ease, background 0.3s;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border-primary);
      flex-shrink: 0;
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .sidebar-header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .sidebar-search {
      padding: 12px 16px;
      flex-shrink: 0;
    }

    .sidebar-search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      background: var(--bg-input);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
    }

    .sidebar-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .sidebar-search input::placeholder { color: var(--text-faint); }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 24px;
    }

    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border-scrollbar); border-radius: 4px; }

    .nav-chapter {
      padding: 0 12px;
      margin-bottom: 4px;
    }

    .nav-chapter-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      padding: 16px 8px 6px;
      user-select: none;
    }

    .nav-link {
      display: block;
      padding: 7px 12px;
      font-size: 0.84rem;
      color: var(--text-tertiary);
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      line-height: 1.4;
    }

    .nav-link:hover {
      background: var(--bg-nav-hover);
      color: var(--text-primary);
    }

    .nav-link.active {
      background: var(--bg-nav-active);
      color: var(--text-nav-active);
      font-weight: 500;
    }

    .nav-link.hidden { display: none; }
    .nav-chapter.hidden { display: none; }

    /* ── Main Content ─────────────────────────────────── */
    .main {
      flex: 1;
      margin-left: 300px;
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-topbar);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-primary);
      padding: 0 40px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: background 0.3s;
    }

    .menu-btn {
      display: none;
      background: none;
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      color: var(--text-tertiary);
    }

    .menu-btn svg { display: block; }

    .breadcrumb {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .breadcrumb span { color: var(--text-primary); font-weight: 500; }

    .topbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── Theme Toggle ─────────────────────────────────── */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      color: var(--text-primary);
      background: var(--bg-nav-hover);
      border-color: var(--text-faint);
    }

    .theme-toggle svg { display: block; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    .github-link {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .github-link:hover { color: var(--text-primary); }

    .content-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 40px 80px;
    }

    /* ── Welcome Screen ───────────────────────────────── */
    .welcome {
      text-align: center;
      padding: 80px 20px;
    }

    .welcome h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .welcome p {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 40px;
    }

    .welcome-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
    }

    .welcome-card {
      padding: 16px;
      background: var(--bg-welcome-card);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
    }

    .welcome-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px var(--accent-card-shadow);
    }

    .welcome-card h3 {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .welcome-card p {
      font-size: 0.75rem;
      color: var(--text-faint);
      margin: 0;
    }

    /* ── Loading ───────────────────────────────────────── */
    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border-primary);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ─────────────────────────────────────────── */
    .error-msg {
      text-align: center;
      padding: 80px 20px;
      color: #ef4444;
    }

    .error-msg h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .error-msg p { font-size: 0.88rem; color: var(--text-muted); }

    .retry-btn {
      margin-top: 16px;
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-btn:hover { background: var(--accent-hover); }

    /* ── Markdown Rendered Content ─────────────────────── */
    .article { animation: fadeIn 0.25s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .article h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      line-height: 1.25;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border-primary);
    }

    .article h2 {
      font-size: 1.4rem;
      font-weight: 650;
      color: var(--text-primary);
      margin-top: 48px;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .article h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 32px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .article h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-tertiary);
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .article p {
      margin-bottom: 16px;
      color: var(--text-secondary);
    }

    .article a {
      color: var(--text-link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .article a:hover { border-bottom-color: var(--text-link); }

    .article ul, .article ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }

    .article li {
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .article li > ul, .article li > ol {
      margin-top: 6px;
      margin-bottom: 0;
    }

    .article strong { font-weight: 600; color: var(--text-primary); }
    .article em { font-style: italic; }

    .article .heading-anchor {
      color: inherit;
      text-decoration: none;
      border-bottom: none;
    }
    .article .heading-anchor:hover { border-bottom: none; }

    .article blockquote {
      margin: 20px 0;
      padding: 16px 20px;
      border-left: 4px solid var(--accent);
      background: var(--bg-blockquote);
      border-radius: 0 8px 8px 0;
      color: var(--text-secondary);
    }

    .article blockquote p { margin-bottom: 0; }

    .article code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      background: var(--bg-code-inline);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-code-inline);
      word-break: break-word;
    }

    .article pre {
      margin: 20px 0;
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg-code-block);
      border: 1px solid var(--border-code-block);
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      background: var(--bg-code-header);
      border-bottom: 1px solid var(--border-code-block);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-code-lang);
      user-select: none;
    }

    .code-lang {
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .copy-btn {
      background: none;
      border: 1px solid var(--border-code-block);
      border-radius: 4px;
      color: var(--text-code-lang);
      font-family: inherit;
      font-size: 0.7rem;
      padding: 2px 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .copy-btn:hover { background: var(--border-code-block); color: var(--text-code-block); }
    .copy-btn.copied { color: #4ade80; border-color: #4ade80; }

    .article pre code {
      display: block;
      padding: 16px 0;
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1;
      background: transparent;
      color: var(--text-code-block);
      border-radius: 0;
      counter-reset: line;
    }

    .code-line {
      display: block;
      padding: 0 20px 0 0;
    }

    .code-line::before {
      counter-increment: line;
      content: counter(line);
      display: inline-block;
      width: 3.5ch;
      margin-right: 16px;
      padding-left: 16px;
      text-align: right;
      color: var(--text-line-number);
      user-select: none;
      font-size: 0.78rem;
    }

    .article pre code::-webkit-scrollbar { height: 6px; }
    .article pre code::-webkit-scrollbar-track { background: var(--code-scrollbar-track); }
    .article pre code::-webkit-scrollbar-thumb { background: var(--code-scrollbar-thumb); border-radius: 3px; }

    .article table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 0.88rem;
      overflow-x: auto;
      display: block;
    }

    .article thead th {
      background: var(--bg-table-head);
      font-weight: 600;
      text-align: left;
      padding: 10px 14px;
      border: 1px solid var(--border-primary);
      color: var(--text-primary);
      white-space: nowrap;
    }

    .article tbody td {
      padding: 10px 14px;
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
      vertical-align: top;
    }

    .article tbody tr:hover { background: var(--bg-surface-hover); }

    .article hr {
      border: none;
      border-top: 1px solid var(--border-primary);
      margin: 32px 0;
    }

    .article img {
      max-width: 100%;
      border-radius: 8px;
      margin: 16px 0;
    }

    /* ── Syntax Highlighting (lightweight) ─────────────── */
    .article pre code .hljs-keyword,
    .article pre code .hljs-built_in { color: #c084fc; }
    .article pre code .hljs-string,
    .article pre code .hljs-template-string { color: #86efac; }
    .article pre code .hljs-number { color: #fbbf24; }
    .article pre code .hljs-comment { color: #64748b; font-style: italic; }
    .article pre code .hljs-function { color: #60a5fa; }
    .article pre code .hljs-attr,
    .article pre code .hljs-attribute { color: #67e8f9; }
    .article pre code .hljs-tag { color: #f472b6; }
    .article pre code .hljs-title { color: #60a5fa; }
    .article pre code .hljs-params { color: #e2e8f0; }
    .article pre code .hljs-meta { color: #94a3b8; }
    .article pre code .hljs-literal { color: #fb923c; }

    /* ── Scroll-to-top ─────────────────────────────────── */
    .scroll-top {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      box-shadow: 0 2px 10px var(--accent-shadow);
      z-index: 200;
    }

    .scroll-top.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-top:hover { transform: scale(1.1); }

    /* ── Overlay for mobile ───────────────────────────── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      z-index: 90;
    }

    .overlay.visible { display: block; }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: 280px;
        min-width: 280px;
      }

      .sidebar.open { transform: translateX(0); }

      .main { margin-left: 0; }

      .menu-btn { display: flex; }

      .topbar { padding: 0 16px; }

      .content-wrap { padding: 24px 16px 60px; }

      .article h1 { font-size: 1.5rem; }
      .article h2 { font-size: 1.2rem; margin-top: 36px; }
      .article pre code { font-size: 0.78rem; padding: 12px 0; }
      .code-line::before { width: 2.5ch; margin-right: 10px; padding-left: 10px; font-size: 0.72rem; }

      .welcome h2 { font-size: 1.4rem; }
      .welcome-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script>
    // Prevent flash of wrong theme on load
    (function() {
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>Frontend System Design</h1>
        <p>In-depth knowledge base</p>
      </div>
      <div class="sidebar-search">
        <input type="text" id="search" placeholder="Search topics..." autocomplete="off" />
      </div>
      <nav class="sidebar-nav" id="nav"></nav>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
        <div class="breadcrumb" id="breadcrumb">Select a topic</div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <a class="github-link" href="https://github.com/AbhishekChorotiya/Frontend-System-Design" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12"/></svg>
            GitHub
          </a>
        </div>
      </header>
      <div class="content-wrap" id="content">
        <!-- Content loads here -->
      </div>
    </main>
  </div>

  <button class="scroll-top" id="scrollTop" aria-label="Scroll to top">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14V4M4 8l5-5 5 5"/></svg>
  </button>

  <!-- Markdown parser (marked.js) + highlight.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/graphql.min.js"></script>

  <script>
    // ── Data ──────────────────────────────────────────
    const REPO_BASE = 'https://raw.githubusercontent.com/AbhishekChorotiya/Frontend-System-Design/main/';

    const chapters = [
      {
        title: 'Frontend Architectural Patterns',
        topics: [
          { name: 'Component-Driven Development', path: 'Frontend Architectural Patterns/Component-Driven Development.md' },
          { name: 'Smart vs Dumb Components', path: 'Frontend Architectural Patterns/Smart vs Dumb Components.md' },
          { name: 'Container vs Presentational Pattern', path: 'Frontend Architectural Patterns/Container vs Presentational Pattern.md' },
          { name: 'Atomic Design', path: 'Frontend Architectural Patterns/Atomic Design.md' },
          { name: 'State Management Strategies', path: 'Frontend Architectural Patterns/State-Management-Strategies.md' },
          { name: 'Code Splitting & Lazy Loading', path: 'Frontend Architectural Patterns/Code-Splitting-Lazy-Loading.md' },
          { name: 'Modular CSS', path: 'Frontend Architectural Patterns/Modular-CSS.md' },
        ],
      },
      {
        title: 'Performance Optimization',
        topics: [
          { name: 'Critical Rendering Path', path: 'Performance-Optimization/Critical-Rendering-Path.md' },
          { name: 'Tree Shaking', path: 'Performance-Optimization/Tree-Shaking.md' },
          { name: 'Web Vitals', path: 'Performance-Optimization/Web-Vitals.md' },
        ],
      },
      {
        title: 'Frontend Security',
        topics: [
          { name: 'Cross-Site Scripting (XSS)', path: 'Frontend-Security/Cross-Site-Scripting-XSS.md' },
          { name: 'Cross-Site Request Forgery (CSRF)', path: 'Frontend-Security/Cross-Site-Request-Forgery-CSRF.md' },
        ],
      },
      {
        title: 'API Integration & Data Handling',
        topics: [
          { name: 'REST vs GraphQL', path: 'API-Integration-Data-Handling/REST-vs-GraphQL.md' },
          { name: 'Pagination, Filtering & Sorting', path: 'API-Integration-Data-Handling/Pagination-Filtering-Sorting.md' },
          { name: 'WebSockets for Real-Time Apps', path: 'API-Integration-Data-Handling/WebSockets-For-Real-Time-Apps.md' },
          { name: 'File Upload Patterns', path: 'API-Integration-Data-Handling/File-Upload-Patterns.md' },
          { name: 'API Retries, Timeouts & Backoff', path: 'API-Integration-Data-Handling/API-Retries-Timeouts-Backoff-Strategies.md' },
        ],
      },
    ];

    // ── DOM refs ──────────────────────────────────────
    const navEl = document.getElementById('nav');
    const contentEl = document.getElementById('content');
    const breadcrumbEl = document.getElementById('breadcrumb');
    const searchEl = document.getElementById('search');
    const sidebarEl = document.getElementById('sidebar');
    const overlayEl = document.getElementById('overlay');
    const menuBtn = document.getElementById('menuBtn');
    const scrollTopBtn = document.getElementById('scrollTop');
    const themeToggle = document.getElementById('themeToggle');

    // ── Theme ────────────────────────────────────────
    function getPreferredTheme() {
      const stored = localStorage.getItem('theme');
      if (stored) return stored;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
    }

    setTheme(getPreferredTheme());

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        setTheme(e.matches ? 'dark' : 'light');
      }
    });

    // ── Configure marked ─────────────────────────────
    function slugify(text) {
      return text.toLowerCase().replace(/<[^>]*>/g, '').replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').trim();
    }

    const renderer = new marked.Renderer();
    renderer.heading = function ({ text, depth }) {
      const raw = typeof text === 'string' ? text : (text.raw || text.text || String(text));
      const slug = slugify(raw);
      return `<h${depth} id="${slug}"><a class="heading-anchor" href="#${slug}">${raw}</a></h${depth}>`;
    };

    marked.setOptions({
      renderer: renderer,
      highlight: function (code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: false,
      gfm: true,
    });

    // ── Build sidebar nav ────────────────────────────
    function buildNav() {
      let html = '';
      chapters.forEach((ch, ci) => {
        html += `<div class="nav-chapter" data-chapter="${ci}">`;
        html += `<div class="nav-chapter-title">${ch.title}</div>`;
        ch.topics.forEach((t, ti) => {
          html += `<a class="nav-link" data-path="${t.path}" data-chapter-idx="${ci}" data-topic-idx="${ti}">${t.name}</a>`;
        });
        html += '</div>';
      });
      navEl.innerHTML = html;

      navEl.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => loadTopic(link.dataset.path));
      });
    }

    // ── Show welcome screen ──────────────────────────
    function showWelcome() {
      const cards = chapters.flatMap(ch =>
        ch.topics.slice(0, 2).map(t =>
          `<div class="welcome-card" data-path="${t.path}"><h3>${t.name}</h3><p>${ch.title}</p></div>`
        )
      );
      contentEl.innerHTML = `
        <div class="welcome">
          <h2>Frontend System Design</h2>
          <p>Pick a topic from the sidebar or start with one below.</p>
          <div class="welcome-grid">${cards.join('')}</div>
        </div>`;
      contentEl.querySelectorAll('.welcome-card').forEach(card => {
        card.addEventListener('click', () => loadTopic(card.dataset.path));
      });
    }

    // ── Cache ────────────────────────────────────────
    const cache = {};

    // ── Load a topic ─────────────────────────────────
    async function loadTopic(path) {
      // Update active state
      navEl.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.path === path));

      // Close mobile sidebar
      sidebarEl.classList.remove('open');
      overlayEl.classList.remove('visible');

      // Find chapter + topic name
      let chapterName = '', topicName = '';
      for (const ch of chapters) {
        const t = ch.topics.find(t => t.path === path);
        if (t) { chapterName = ch.title; topicName = t.name; break; }
      }
      breadcrumbEl.innerHTML = `${chapterName} / <span>${topicName}</span>`;

      // Update URL hash
      history.pushState(null, '', '#' + encodeURIComponent(path));

      // Show loader
      contentEl.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

      // Fetch
      try {
        let md;
        if (cache[path]) {
          md = cache[path];
        } else {
          const url = REPO_BASE + encodeURIComponent(path).replace(/%2F/g, '/');
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          md = await res.text();
          cache[path] = md;
        }
        contentEl.innerHTML = `<div class="article">${marked.parse(md)}</div>`;

        // Enhance code blocks: add header (lang + copy) and line numbers
        contentEl.querySelectorAll('.article pre').forEach(pre => {
          const code = pre.querySelector('code');
          if (!code) return;

          // Extract language from class
          const langClass = Array.from(code.classList).find(c => c.startsWith('language-'));
          const lang = langClass ? langClass.replace('language-', '') : 'code';

          // Add line numbers by wrapping each line in a span
          const rawHTML = code.innerHTML;
          const lines = rawHTML.replace(/\n$/, '').split('\n');
          code.innerHTML = lines.map(line => `<span class="code-line">${line || ' '}</span>`).join('\n');

          // Create header
          const header = document.createElement('div');
          header.className = 'code-header';
          header.innerHTML = `<span class="code-lang">${lang}</span><button class="copy-btn" aria-label="Copy code"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span></button>`;
          pre.insertBefore(header, code);

          // Copy handler
          header.querySelector('.copy-btn').addEventListener('click', function () {
            const text = code.textContent;
            navigator.clipboard.writeText(text).then(() => {
              this.classList.add('copied');
              this.querySelector('span').textContent = 'Copied!';
              setTimeout(() => {
                this.classList.remove('copied');
                this.querySelector('span').textContent = 'Copy';
              }, 2000);
            });
          });
        });

        // Handle in-article heading anchor clicks
        contentEl.querySelectorAll('.heading-anchor').forEach(a => {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            const id = a.getAttribute('href').slice(1);
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
            history.replaceState(null, '', a.getAttribute('href'));
          });
        });

        // Handle relative .md cross-links (e.g. ./Other-Topic.md)
        const chapterDir = path.substring(0, path.lastIndexOf('/'));
        contentEl.querySelectorAll('.article a[href$=".md"]').forEach(a => {
          if (a.classList.contains('heading-anchor')) return;
          a.addEventListener('click', (e) => {
            e.preventDefault();
            const href = decodeURIComponent(a.getAttribute('href'));
            const filename = href.replace(/^\.\//, '');
            const targetPath = chapterDir + '/' + filename;
            const exists = chapters.some(ch => ch.topics.some(t => t.path === targetPath));
            if (exists) { loadTopic(targetPath); } else { window.open(REPO_BASE + targetPath, '_blank'); }
          });
        });

        window.scrollTo({ top: 0 });
      } catch (err) {
        contentEl.innerHTML = `
          <div class="error-msg">
            <h3>Failed to load article</h3>
            <p>${err.message}</p>
            <button class="retry-btn" onclick="loadTopic('${path}')">Retry</button>
          </div>`;
      }
    }

    // ── Search / filter ──────────────────────────────
    searchEl.addEventListener('input', () => {
      const q = searchEl.value.toLowerCase().trim();
      navEl.querySelectorAll('.nav-chapter').forEach(chapterEl => {
        const links = chapterEl.querySelectorAll('.nav-link');
        let anyVisible = false;
        links.forEach(link => {
          const match = !q || link.textContent.toLowerCase().includes(q);
          link.classList.toggle('hidden', !match);
          if (match) anyVisible = true;
        });
        chapterEl.classList.toggle('hidden', !anyVisible);
      });
    });

    // ── Mobile menu ──────────────────────────────────
    menuBtn.addEventListener('click', () => {
      sidebarEl.classList.add('open');
      overlayEl.classList.add('visible');
    });

    overlayEl.addEventListener('click', () => {
      sidebarEl.classList.remove('open');
      overlayEl.classList.remove('visible');
    });

    // ── Scroll-to-top button ─────────────────────────
    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ── Handle hash navigation ───────────────────────
    function handleHash() {
      const hash = decodeURIComponent(location.hash.slice(1));
      if (!hash) { showWelcome(); breadcrumbEl.textContent = 'Select a topic'; return; }

      // Check if it's a topic path (contains / and ends with .md)
      const isTopic = hash.includes('/') && hash.endsWith('.md');
      if (isTopic) {
        const exists = chapters.some(ch => ch.topics.some(t => t.path === hash));
        if (exists) { loadTopic(hash); return; }
      }

      // Otherwise it's an in-page heading anchor — scroll to it
      const target = document.getElementById(hash);
      if (target) { target.scrollIntoView({ behavior: 'smooth' }); return; }

      // Unknown hash — ignore, don't navigate away from current content
      if (document.querySelector('.article')) return;
      showWelcome();
      breadcrumbEl.textContent = 'Select a topic';
    }

    window.addEventListener('hashchange', handleHash);

    // ── Init ─────────────────────────────────────────
    buildNav();
    handleHash();
  </script>
</body>
</html>
